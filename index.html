<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Kirolos Magdy Portfolio</title>

	<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%20100%20100'%3E%3Ctext%20y%3D'.9em'%20font-size%3D'90'%3E%F0%9F%93%8A%3C%2Ftext%3E%3C%2Fsvg%3E">
    <style>
        /* Cool Slate & Navy Theme */
        :root {
            --bg-main: #0f172a;       
            --bg-card: #1e293b;       
            --text-main: #f8fafc;     
            --text-muted: #94a3b8;    
            --accent: #38bdf8;        
            --border: #334155;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 2rem;
            line-height: 1.5;
        }

        /* Header Layout */
        header {
			max-width: 1200px;
			margin: 0 auto 3rem auto;
			display: flex;
			align-items: center;
			gap: 2.5rem;
			padding-bottom: 2rem;
			border-bottom: 1px solid var(--border);
		}

        .profile-img {
			width: 200px;
			height: 240px;
			object-fit: cover;

			/* Rounded square instead of a circle */
			border-radius: 18px;

			border: 3px solid var(--accent);
			box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);

			flex-shrink: 0;
		}

        .header-info h1 { margin: 0 0 0.25rem 0; font-size: 2.5rem; color: var(--text-main); }
        .header-info h2 { margin: 0 0 1rem 0; font-size: 1.25rem; color: var(--accent); font-weight: 500; }

        .contact-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem 1.5rem;
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        .contact-grid a {
            color: var(--text-muted);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            transition: color 0.2s;
        }

        .contact-grid a:hover { color: var(--accent); }

        /* Grid & Cards */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 1.5rem;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .card h3 { margin: 0 0 0.5rem 0; font-size: 1.25rem; }
        .card h3 a {
            color: var(--text-main);
            text-decoration: none;
            transition: color 0.2s;
        }
        .card h3 a:hover { color: var(--accent); }
        .card p { font-size: 0.95rem; color: var(--text-muted); flex-grow: 1; }

        /* Image Gallery with button navigation */
        .gallery-wrapper {
            position: relative;
            margin-bottom: 1rem;
        }

        .image-scroller {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            gap: 10px;
            border-radius: 8px;
            scroll-behavior: smooth;

            /* Hide native scrollbar; buttons handle navigation now */
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .image-scroller::-webkit-scrollbar { display: none; }

        .image-scroller img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            flex-shrink: 0;
            scroll-snap-align: center;
            border-radius: 8px;
            border: 1px solid var(--border);
            transition: opacity 0.2s;
        }
        
        .image-scroller img:hover { opacity: 0.85; }

        .gallery-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: rgba(15, 23, 42, 0.75);
            color: var(--text-main);
            font-size: 1.1rem;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            opacity: 0;
            transition: opacity 0.2s, background 0.2s, color 0.2s, border-color 0.2s;
        }

        .gallery-wrapper:hover .gallery-nav:not(:disabled) { opacity: 1; }

        .gallery-nav:hover:not(:disabled) {
            background: var(--accent);
            color: var(--bg-main);
            border-color: var(--accent);
        }

        .gallery-nav:disabled {
            opacity: 0 !important;
            pointer-events: none;
        }

        .gallery-nav.prev { left: 8px; }
        .gallery-nav.next { right: 8px; }

        /* Touch devices: keep buttons visible since there's no hover state */
        @media (hover: none) {
            .gallery-nav:not(:disabled) { opacity: 1; }
        }

        /* Tags */
        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin: 1.25rem 0;
        }

        .tag {
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.025em;
        }

        /* Action Links */
        .links {
            display: flex;
            gap: 1rem;
            margin-top: auto;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
        }

        .links a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: opacity 0.2s;
        }

        .links a:hover { opacity: 0.8; text-decoration: underline; }

        /* Responsive */
        @media (max-width: 768px) {
            header { flex-direction: column; text-align: center; }
            .contact-grid { justify-content: center; }
        }
    </style>
</head>
<body>

    <header>
        <img src="assets/images/projects/profile.jpg" alt="Kirolos Magdy Girgs" class="profile-img">
        
        <div class="header-info">
            <h1>Kirolos Magdy Girgs</h1>
            <h2>Data Analyst | BI Developer | Football Analyst</h2>
            
            <div class="contact-grid">
                <span>📍 Cairo, Egypt (Willing to relocate)</span>
                <span>📱 +201068873267</span>
				<span>✉️ kirolos.magdy.girgs@gmail.com</span>

				<div style="flex-basis:100%; height:0;"></div>

				<a href="https://www.linkedin.com/in/kirolos-magdy-girgs/" target="_blank">🔗 LinkedIn: Kirolos Magdy</a>
				<a href="https://github.com/KirolosMagdyGirgs" target="_blank">💻 GitHub: KirolosMagdyGirgs</a>
				<a href="https://novypro.com/profile/kirolosmagdy" target="_blank">📊 NovyPro: Kirolos Magdy</a>
            </div>
        </div>
    </header>

    <main class="grid" id="portfolio-grid"></main>

    <script>
        function getTagStyle(tag) {
            const t = tag.toLowerCase();
            if (t.includes('python') || t.includes('pandas')) {
                return 'background-color: #1e3a8a; color: #bfdbfe; border: 1px solid #3b82f6;'; 
            }
            if (t.includes('power bi') || t.includes('excel')) {
                return 'background-color: #422006; color: #fef08a; border: 1px solid #eab308;'; 
            }
            if (t.includes('sql') || t.includes('database') || t.includes('dbt')) {
                return 'background-color: #7c2d12; color: #ffedd5; border: 1px solid #f97316;'; 
            }
            if (t.includes('r') || t.includes('deepseek') || t.includes('ai') || t.includes('machine learning')) {
                return 'background-color: #b91c1c; color: #ffffff; border: 1px solid #991b1b;'; 
            }
            if (t.includes('streamlit') || t.includes('web')) {
                return 'background-color: #d1fae5; color: #065f46; border: 1px solid #34d399;'; 
            }
            return 'background-color: #334155; color: #f8fafc; border: 1px solid #475569;'; 
        }

        // Wires up the prev/next buttons for one gallery, and keeps them
        // enabled/disabled based on scroll position.
        function initGalleryNav(wrapper) {
            const scroller = wrapper.querySelector('.image-scroller');
            const prevBtn = wrapper.querySelector('.gallery-nav.prev');
            const nextBtn = wrapper.querySelector('.gallery-nav.next');
            if (!scroller || !prevBtn || !nextBtn) return;

            const step = () => (scroller.querySelector('img')?.clientWidth || scroller.clientWidth) + 10; // image width + gap

            const updateButtons = () => {
                const maxScroll = scroller.scrollWidth - scroller.clientWidth;
                prevBtn.disabled = scroller.scrollLeft <= 2;
                nextBtn.disabled = scroller.scrollLeft >= maxScroll - 2;
            };

            prevBtn.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();
                scroller.scrollBy({ left: -step(), behavior: 'smooth' });
            });

            nextBtn.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();
                scroller.scrollBy({ left: step(), behavior: 'smooth' });
            });

            scroller.addEventListener('scroll', updateButtons);
            updateButtons();
        }

        fetch('projects.json')
            .then(response => response.json())
            .then(data => {
                const grid = document.getElementById('portfolio-grid');
                
                data.forEach(project => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    
                    // 1. Gather all images (Thumbnail + Gallery)
                    const images = [];
                    if (project.media && project.media.thumbnail) {
                        images.push(project.media.thumbnail);
                    }
                    if (project.media && project.media.gallery && project.media.gallery.length > 0) {
                        project.media.gallery.forEach(img => {
                            if (!images.includes(img)) images.push(img); // Avoid duplicates
                        });
                    }

                    // Determine where clicking the title should take the user
                    const clickLink = project.links.livePreview || project.links.article || project.links.githubCode || null;

                    // 2. Build the Image Gallery HTML (images are no longer clickable)
                    let mediaHTML = '';
                    if (images.length > 0) {
                        const imgTags = images.map(img => `<img src="${img}" alt="${project.title}">`).join('');

                        // Nav buttons only make sense with more than one image.
                        const navHTML = images.length > 1 ? `
                                <button type="button" class="gallery-nav prev" aria-label="Previous image">&#10094;</button>
                                <button type="button" class="gallery-nav next" aria-label="Next image">&#10095;</button>
                            ` : '';
                        
                        mediaHTML = `
                            <div class="gallery-wrapper">
                                <div class="image-scroller">
                                    ${imgTags}
                                </div>
                                ${navHTML}
                            </div>
                        `;
                    }
                    
                    const tags = project.techStack.map(tag => {
                        return `<span class="tag" style="${getTagStyle(tag)}">${tag}</span>`;
                    }).join('');
                    
                    let links = '';
                    if (project.links.livePreview) {
                        links += `<a href="${project.links.livePreview}" target="_blank">Live View &rarr;</a>`;
                    }
                    if (project.links.githubCode) {
                        links += `<a href="${project.links.githubCode}" target="_blank">GitHub &rarr;</a>`;
                    }
                    if (project.links.article) {
                        links += `<a href="${project.links.article}" target="_blank">Read Analysis &rarr;</a>`;
                    }

                    // Title is clickable (opens the same link the image gallery used to)
                    const titleHTML = clickLink
                        ? `<h3><a href="${clickLink}" target="_blank">${project.title}</a></h3>`
                        : `<h3>${project.title}</h3>`;

                    card.innerHTML = `
                        ${mediaHTML}
                        ${titleHTML}
                        <p>${project.shortDescription}</p>
                        <div class="tags">${tags}</div>
                        <div class="links">${links}</div>
                    `;
                    
                    grid.appendChild(card);

                    const wrapper = card.querySelector('.gallery-wrapper');
                    if (wrapper) initGalleryNav(wrapper);
                });
            })
            .catch(error => console.error('Error loading projects:', error));
    </script>
</body>
</html>
